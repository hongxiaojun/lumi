[package]
name = "leaf-reader"
version = "0.1.0"
description = "Lumi"
authors = ["xiaojun"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "leaf_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-tts = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "0.15", default-features = false }
objc2 = "0.6"
objc2-core-graphics = "0.3"
objc2-foundation = { version = "0.3", features = ["NSData", "NSError", "NSArray", "NSString"] }
objc2-vision = "0.3"

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
tao = { path = "vendor/tao" }
# iOS route policy lives in this copy: AirPlay must keep speaking.
tauri-plugin-tts = { path = "vendor/tauri-plugin-tts" }
