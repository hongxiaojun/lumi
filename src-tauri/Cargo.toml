[package]
name = "leaf-reader"
version = "0.1.0"
description = "Lumi"
authors = ["xiaojun"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "leaf_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[dev-dependencies]
tempfile = "3"
